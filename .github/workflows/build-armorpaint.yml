name: Build ArmorPaint (Windows 10)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository Recursively
        uses: actions/checkout@v4
        with:
          repository: armory3d/armorpaint
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Add MSBuild & Clang tools to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Install Clang Compiler Tools for Visual Studio
        shell: powershell
        run: |
          # ArmorPaint requires Clang tools for Windows to compile the generated solution
          Start-Process -FilePath "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vs_installer.exe" -ArgumentList "modify --id Microsoft.VisualStudio.Workload.VCTools --add Microsoft.VisualStudio.Component.VC.ClangCompiler --quiet --norestart" -Wait -NoNewWindow

      - name: Generate Visual Studio Project
        shell: cmd
        run: |
          cd paint
          node ..\base\make

      - name: Compile Solution with MSBuild
        shell: cmd
        run: |
          cd paint
          # Compiles the newly generated solution file
          msbuild build\ArmorPaint.sln /p:Configuration=Release /p:Platform=x64
          
      - name: Prepare Deployment Package
        shell: cmd
        run: |
          mkdir out
          # Bundle the executable back inside the data container folder (krom) so assets load properly
          copy paint\build\x64\Release\ArmorPaint.exe paint\build\krom\ArmorPaint.exe
          xcopy /E /I paint\build\krom out\

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: armorpaint-windows-x64
          path: out/
