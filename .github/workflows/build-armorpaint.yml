name: Build ArmorPaint (Windows 10)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository Recursively
        uses: actions/checkout@v4
        with:
          # If building directly from a fork or custom repo, make sure to pull submodules
          repository: armory3d/armorpaint
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Generate Visual Studio Solution
        shell: cmd
        run: |
          cd paint
          node ..\base\make

      - name: Compile Solution with MSBuild
        shell: cmd
        run: |
          msbuild build\ArmorPaint.sln /p:Configuration=Release /p:Platform=x64

      - name: Prepare Deployment Package
        shell: cmd
        run: |
          mkdir out
          :: Copy the built executable to the deployment runtime directory
          copy build\x64\Release\ArmorPaint.exe build\krom\ArmorPaint.exe
          :: Move the full runtime game/app data folder into the final artifact folder
          xcopy /E /I build\krom out\

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: armorpaint-windows-x64
          path: out/
