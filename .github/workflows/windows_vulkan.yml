name: Windows (Vulkan)

on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main

jobs:
  build:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v3
    - name: Install Vulkan SDK
      uses: jakoch/install-vulkan-sdk-action@v1
      with:
        vulkan_version: latest
        install_runtime: false
        cache: true
        stripdown: true
    - name: Compile
      run: |
        cd paint
        ../base/make --compile
