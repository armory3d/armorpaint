name: Windows (Direct3D12)

on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main

permissions:
  contents: read

jobs:
  build:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false
    - name: Compile
      run: |
        cd paint
        ../base/make --compile
