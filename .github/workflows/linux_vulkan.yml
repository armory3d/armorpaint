name: Linux (Vulkan)

on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false
    - name: Apt Update
      run: sudo apt-get update
    - name: Apt Install
      run: sudo apt install make clang libvulkan-dev libgtk-3-dev libasound2-dev --yes --quiet
    - name: Compile
      run: |
        cd paint
        ../base/make --compile
